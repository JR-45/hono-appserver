info:
  name: Suche Mitglied mit ID 1
  type: graphql
  seq: 1

graphql:
  method: POST
  url: "{{graphqlUrl}}"
  headers:
    - name: Accept
      value: application/graphql-response+json
  body:
    query: |-
      query ($id: ID! = "1") {
        mitglied(id: $id) {
          id
          version
          vorname
          nachname
          email
          geburtsdatum
          telefonnummer
          geschlecht
          mitgliedsstatus
          beitrittsdatum
          interessen
          ausweis {
            ausstellungsdatum
            ablaufdatum
          }
        }
      }
    variables: |-
      {
        "id": "1"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: matches
      value: ^application\/graphql-response\+json(; charset=utf-8)?$
    - expression: res.body.data.mitglied.id
      operator: isString
    - expression: res.body.data.mitglied.version
      operator: gte
      value: "0"
    - expression: res.body.data.mitglied.vorname
      operator: isString
    - expression: res.body.data.mitglied.nachname
      operator: isString
    - expression: res.body.data.mitglied.email
      operator: isString

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
