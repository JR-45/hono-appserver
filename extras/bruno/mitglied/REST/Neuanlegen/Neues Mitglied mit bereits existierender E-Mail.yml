info:
  name: Neues Mitglied mit bereits existierender E-Mail
  type: http
  seq: 2

http:
  method: POST
  url: "{{restUrl}}"
  headers:
    - name: ""
      value: ""
      disabled: true
  body:
    type: json
    data: |-
      {
        "vorname": "Test",
        "nachname": "User",
        "email": "admin@acme.com",
        "mitgliedsstatus": "AKTIV"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "422"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
