info:
  name: Neues Mitglied ohne Token
  type: http
  seq: 3

http:
  method: POST
  url: "{{restUrl}}"
  headers:
    - name: ""
      value: ""
      disabled: true
  body:
    type: json
    data: |-
      {
        "vorname": "Test",
        "nachname": "User",
        "email": "test.notoken@example.com",
        "mitgliedsstatus": "AKTIV"
      }
  auth: none

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
