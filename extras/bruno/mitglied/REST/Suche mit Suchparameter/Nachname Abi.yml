info:
  name: Nachname Abi
  type: http
  seq: 2

http:
  method: GET
  url: "{{restUrl}}?nachname=Abi"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: nachname
      value: Abi
      type: query
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.content
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
