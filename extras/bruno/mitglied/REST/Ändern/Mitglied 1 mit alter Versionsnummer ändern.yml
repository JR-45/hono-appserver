info:
  name: Mitglied 1 mit alter Versionsnummer ändern
  type: http
  seq: 3

http:
  method: PUT
  url: "{{restUrl}}/:id"
  headers:
    - name: If-Match
      value: '"999"'
  params:
    - name: id
      value: "1000"
      type: path
  body:
    type: json
    data: |
      {
        "vorname": "Admin",
        "nachname": "User",
        "email": "admin@acme.com",
        "mitgliedsstatus": "AKTIV"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "412"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
